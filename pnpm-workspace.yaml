packages:
  - .
strictPeerDependencies: true
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
minimumReleaseAgeExclude:
  - "@voidzero-dev/vite-plus-core@1.3.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.3.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.3.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.3.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.3.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.3.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.3.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.3.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.3.0"
  - vite-plus@1.3.0
  - "@yansircc/effect-scan@0.1.19"
  - "@cloudflare/vite-plugin@2.0.0-beta.sha-52b0dc0e9"
catalog:
  effect: 4.0.5
  "@effect/vitest": 4.0.5
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest: 5.0.5
  vite-plus: 1.3.0
peerDependencyRules:
  allowedVersions:
    "@cloudflare/vite-plugin@2.0.0-beta.sha-52b0dc0e9>vite": "1.3.0"
    "vitest@5.0.5>vite": "1.3.0"
    "@vitest/mocker@5.0.5>vite": "1.3.0"
    "agents@0.26.0>vite": "1.3.0"
    # agents' optional babel plugin wants vite ^8; the aliased core is Vite 8 under a 1.3.0 version number.
    "@rolldown/plugin-babel@0.2.4>vite": "1.3.0"
allowBuilds:
  # 这三个来自 @cloudflare/think 的依赖链（just-bash 等），Worker 里用不到原生构建
  "@mongodb-js/zstd": false
  core-js-pure: false
  node-liblzma: false
  esbuild: false
  msgpackr-extract: false
  workerd: false
