packages:
  - .
strictPeerDependencies: true
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
minimumReleaseAgeExclude:
  - "@voidzero-dev/vite-plus-core@0.3.1"
  - "@voidzero-dev/vite-plus-darwin-arm64@0.3.1"
  - "@voidzero-dev/vite-plus-darwin-x64@0.3.1"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@0.3.1"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@0.3.1"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@0.3.1"
  - "@voidzero-dev/vite-plus-linux-x64-musl@0.3.1"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@0.3.1"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@0.3.1"
  - vite-plus@0.3.1
  - "@yansircc/effect-scan@0.1.19"
  - "@cloudflare/vite-plugin@2.0.0-beta.sha-52b0dc0e9"
catalog:
  effect: 4.0.0-rc.112
  "@effect/vitest": 4.0.0-rc.112
  vite: npm:@voidzero-dev/vite-plus-core@0.3.1
  vitest: 4.1.11
  vite-plus: 0.3.1
peerDependencyRules:
  allowedVersions:
    "@cloudflare/vite-plugin@2.0.0-beta.sha-52b0dc0e9>vite": "0.3.1"
    "vitest@4.1.11>vite": "0.3.1"
    "@vitest/mocker@4.1.11>vite": "0.3.1"
    "agents@0.26.0>vite": "0.3.1"
allowBuilds:
  # 这三个来自 @cloudflare/think 的依赖链（just-bash 等），Worker 里用不到原生构建
  "@mongodb-js/zstd": false
  core-js-pure: false
  node-liblzma: false
  esbuild: false
  msgpackr-extract: false
  workerd: false
