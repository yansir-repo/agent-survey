name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # `vp run ci`: types, lint, tests, build (`JUDGMENTS` in vite.config.ts). The Effect scanner
  # (`check:effect`) is a native binary CI cannot install; it runs only in pre-push and deploy.
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vp run ci
